name: Distribute a post

# Manual only. There is no push trigger by design: a post should be able to
# ship, be corrected, and ship again without anything reaching an audience in
# between. Sending happens when someone decides it should.
#
# Reads social/<slug>.md for the copy. Discord and Telegram post immediately;
# X and LinkedIn are queued in Buffer as drafts for a person to approve there.
#
# Secrets — each channel is skipped rather than failing when its own are absent,
# so a partial setup still works:
#   DISCORD_WEBHOOK_URL
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   BUFFER_ACCESS_TOKEN, BUFFER_CHANNEL_X, BUFFER_CHANNEL_LINKEDIN

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug (the filename in blog/src/content/posts, without .md)'
        required: true
      channels:
        description: 'Which channels to send to'
        type: choice
        default: all
        options:
          - all
          - discord
          - telegram
          - x
          - linkedin
          - discord,telegram
          - x,linkedin
      dry_run:
        description: 'Dry run — show what would be sent, send nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Distribute
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_X: ${{ secrets.BUFFER_CHANNEL_X }}
          BUFFER_CHANNEL_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_LINKEDIN }}
        run: |
          # Without pipefail the exit code is tee's, and a failed send would
          # show as a green run.
          set -o pipefail
          FLAGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ inputs.channels }}" != "all" ] && FLAGS="$FLAGS --only=${{ inputs.channels }}"

          node scripts/distribute.js "${{ inputs.slug }}" $FLAGS | tee run.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Distribute — \`${{ inputs.slug }}\`"
            echo ""
            echo "Channels: \`${{ inputs.channels }}\` · Dry run: \`${{ inputs.dry_run }}\`"
            echo ""
            echo '```'
            cat run.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
