<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b17e5"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d1495b"/>
    </marker>
    <style>
      .f{font-family:Poppins,'Helvetica Neue',Arial,sans-serif}
      .n{font-size:14px;font-weight:600;fill:#0a051a}
      .e{font-size:11.5px;font-weight:600;fill:#4b17e5}
      .m{font-size:11.5px;font-weight:400;fill:rgba(10,5,26,.62)}
      .err{font-size:11.5px;font-weight:600;fill:#d1495b}
      .box{fill:#ffffff;stroke:rgba(10,5,26,.10)}
      .edge{stroke:#4b17e5;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="680" height="380" fill="#fcfbff"/>

  <g class="f">
    <circle cx="56" cy="103" r="38" fill="#4b17e5" fill-opacity=".10" stroke="#4b17e5" stroke-width="2"/>
    <text x="56" y="100" text-anchor="middle" class="n" fill="#4b17e5">KMOI</text>
    <text x="56" y="118" text-anchor="middle" class="m" font-size="10.5">balance</text>

    <path class="edge" d="M98 103 H190"/>
    <text x="144" y="88" text-anchor="middle" class="e">StorageDeposit</text>

    <g transform="translate(196,48)">
      <rect width="190" height="110" rx="16" class="box"/>
      <text x="18" y="30" class="n">Storage grant</text>
      <text x="18" y="50" class="m">held on the target account</text>
      <rect x="18" y="64" width="154" height="13" rx="6.5" fill="#f5f2ff" stroke="#4b17e5" stroke-opacity=".28"/>
      <rect x="18" y="64" width="96" height="13" rx="6.5" fill="#4b17e5" fill-opacity=".55"/>
      <text x="18" y="96" class="m" font-size="10.5">used</text>
      <text x="172" y="96" text-anchor="end" class="m" font-size="10.5">free</text>
    </g>

    <path class="edge" d="M390 103 H468"/>
    <text x="429" y="88" text-anchor="middle" class="e">logic writes</text>
    <text x="429" y="122" text-anchor="middle" class="m">bytes deducted</text>

    <g transform="translate(474,48)">
      <rect width="190" height="110" rx="16" class="box"/>
      <text x="18" y="30" class="n">State persists</text>
      <text x="18" y="50" class="m">paid for before it landed</text>
      <rect x="18" y="66" width="154" height="8" rx="4" fill="#4b17e5" fill-opacity=".50"/>
      <rect x="18" y="80" width="154" height="8" rx="4" fill="#4b17e5" fill-opacity=".34"/>
      <rect x="18" y="94" width="92"  height="8" rx="4" fill="#4b17e5" fill-opacity=".20"/>
    </g>

    <path class="edge" d="M569 158 V212 Q569 230 551 230 H74 Q56 230 56 212 V147"/>
    <text x="560" y="213" text-anchor="end" class="e">StorageWithdraw — unused bytes return</text>

    <path d="M291 158 V292" stroke="#d1495b" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
    <text x="281" y="196" text-anchor="end" class="err">no grant</text>

    <g transform="translate(150,304)">
      <rect width="400" height="56" rx="14" fill="#fff" stroke="#d1495b" stroke-opacity=".45"/>
      <text x="20" y="24" class="err">Write refused</text>
      <text x="20" y="43" class="m">the interaction reverts — storage is never billed after the fact</text>
    </g>
  </g>
</svg>
