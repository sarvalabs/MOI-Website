<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- default-light is the purple-planet mark: it reads on both light and
         dark browser chrome. The -dark variant is pale-on-transparent and,
         until its stylesheet is restored, renders solid black. -->
    <link rel="icon" type="image/svg+xml" href="/brand/logos/SVG/default-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOI — The participant layer for AI agents</title>
    <meta
      name="description"
      content="You exist once, on chain. Monitor, scope, and revoke your AI agents in real time."
    />
    <link rel="canonical" href="https://moi.technology/" />
    <!-- Social/link-preview cards. scripts/prerender-routes.js rewrites these
         (and title/description/canonical) per route at build time, so keep the
         values here in sync with the "/" entry in that script's route table. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moi.technology/" />
    <meta property="og:title" content="MOI — The participant layer for AI agents" />
    <meta property="og:description" content="You exist once, on chain. Monitor, scope, and revoke your AI agents in real time." />
    <meta property="og:image" content="https://moi.technology/brand/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@moi_tech" />
    <!-- Entity schema: ties moi.technology and the docs properties to one
         Organization node that search and AI answer engines can resolve. The
         docs sites reference this same @id as their publisher. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://moi.technology/#organization",
            "name": "MOI",
            "legalName": "Sarva Labs Inc",
            "url": "https://moi.technology",
            "logo": "https://moi.technology/brand/logos/PNG/Default%20-%20Light%20-%20400px.png",
            "description": "MOI is the participant layer for AI agents - an on-chain authority layer where you monitor, scope, and revoke your AI agents in real time.",
            "sameAs": [
              "https://github.com/sarvalabs",
              "https://twitter.com/moi_tech",
              "https://t.me/moi_tech",
              "https://discord.com/invite/4mUq3GeBMx",
              "https://medium.com/moi-technology",
              "https://www.youtube.com/channel/UCit7h30bhrwxBd1Yt_bmPvg",
              "https://www.linkedin.com/company/moi-tech",
              "https://www.sarva.ai",
              "https://blog.moi.technology",
              "https://docs.moi.technology"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://moi.technology/#website",
            "name": "MOI",
            "url": "https://moi.technology",
            "publisher": { "@id": "https://moi.technology/#organization" }
          }
        ]
      }
    </script>
    <!-- Google Tag Manager. GA4 lives as a tag inside the container, so
         tracking can change without a code change and a deploy. The hostname
         guard is a trigger condition in GTM, not here — the noscript iframe
         below cannot be gated in code. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-M4BR46Z2');</script>
  </head>
  <body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M4BR46Z2"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div id="root"></div>
    <!--
      The app renders client-side, so without this block a reader (or crawler)
      without JavaScript gets a blank page and no way to reach anything —
      including the blog, which is a separate static site on its own host.
    -->
    <noscript>
      <nav>
        <a href="/why-moi">The Shift</a>
        <a href="https://docs.moi.technology">Docs</a>
        <a href="/manifesto">Manifesto</a>
        <a href="/papers">Papers</a>
        <a href="/blog">Blog</a>
      </nav>
      <h1>MOI — The participant layer for AI agents</h1>
      <p>
        MOI gives every participant — human or agent — persistent, portable
        existence in computation. On-chain authority for the agentic economy.
      </p>
      <p><a href="/blog">Read the MOI blog</a> for writing on Contextual
        Compute, agent authority, protocol research, and product updates.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
